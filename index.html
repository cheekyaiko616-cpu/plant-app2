<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Verdant Log 2</title>
<style>
:root {
  --bg: #f5f6f2; --surface: #ffffff; --text: #1d2b22; --muted: #6c7a70;
  --accent: #3d7a5a; --accent2: #8fbf9f; --accent-soft: #e6efe8;
  --danger: #c4574d; --border: #e1e7e0;
  --hero: linear-gradient(135deg, #2f6b4c, #4f8f6c);
  --warn-bg: #fbe9e5; --warn-fg: #a8463d;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1712; --surface: #17221b; --text: #e4ece6; --muted: #98a89d;
    --accent: #7fb898; --accent2: #4f8f6c; --accent-soft: #1f2e25;
    --danger: #eba39a; --border: #2a3a2f;
    --hero: linear-gradient(135deg, #24503a, #3b6e52);
    --warn-bg: #3f2623; --warn-fg: #eba39a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0f1712; --surface: #17221b; --text: #e4ece6; --muted: #98a89d;
    --accent: #7fb898; --accent2: #4f8f6c; --accent-soft: #1f2e25;
    --danger: #eba39a; --border: #2a3a2f;
    --hero: linear-gradient(135deg, #24503a, #3b6e52);
    --warn-bg: #3f2623; --warn-fg: #eba39a;
    color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); }
html { height: 100%; }
body {
  margin: 0; height: 100%; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  overscroll-behavior: none; touch-action: manipulation; color: var(--text);
  font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  background: var(--bg);
  background-image: radial-gradient(circle at 10% 0%, rgba(123,198,126,0.18), transparent 40%),
                    radial-gradient(circle at 100% 20%, rgba(255,214,102,0.12), transparent 35%);
}
button, select, input, textarea { font: inherit; }
header {
  flex-shrink: 0;
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--hero); color: #fff; padding: 14px 16px;
  box-shadow: 0 2px 10px rgba(46,139,87,0.25);
}
header { display: flex; align-items: center; justify-content: center; min-height: 52px; }
header h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 0.04em; }
header { overflow: hidden; }

header > * { position: relative; z-index: 1; }
.month-pick { display: none; align-items: center; margin-right: auto; }
.brand { display: none; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 13px; letter-spacing: 0.18em; color: #fff; opacity: 0.92; }
header.calendar-head { flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; padding: 10px 16px 12px; }
header.calendar-head .brand { display: block; }
header.calendar-head h1 { display: none; }
.month-pick .pill {
  display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; flex-shrink: 0;
  background: #fff; color: #1f5c3a; border-radius: 12px; padding: 6px 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.18);
}
.month-pick .pill { font: inherit; font-size: 16px; font-weight: bold; border: none; cursor: pointer; }
.month-pick .caret { font-size: 12px; margin-left: 4px; color: #1f5c3a; }
.month-pick { gap: 8px; }
.today-btn { font: inherit; font-size: 14px; font-weight: bold; background: transparent; color: #fff; border: 2px solid #fff; border-radius: 12px; padding: 4px 12px; cursor: pointer; white-space: nowrap; }
.wheel-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
.wheel-box { position: relative; display: flex; height: 200px; }
.wheel-band { position: absolute; left: 0; right: 0; top: 80px; height: 40px; background: var(--accent-soft); border-radius: 10px; pointer-events: none; z-index: 0; }
.wheel { position: relative; z-index: 1; flex: 1; height: 200px; overflow-y: auto; scroll-snap-type: y mandatory; text-align: center; padding: 80px 0; }
.wheel::-webkit-scrollbar { display: none; }
.wheel { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; overflow-x: hidden; touch-action: pan-y; }
/* 年月選択は縦方向のスクロールだけ（左右には動かさない） */
#wheelOverlay .sheet, .wheel-box { touch-action: pan-y; overflow-x: hidden; }
.wheel .wi { height: 40px; line-height: 40px; scroll-snap-align: center; font-size: 18px; color: var(--muted); transform: scale(.92); transition: transform .12s ease, color .12s ease; }
.wheel .wi.on { color: var(--accent); font-weight: bold; transform: scale(1.08); }
main { padding: 16px 16px 110px; max-width: 720px; width: 100%; margin: 0 auto; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: auto; -webkit-overflow-scrolling: touch; }
.view { display: none; }
.view.active { display: block; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.day-nav { display: flex; align-items: center; gap: 8px; }
.day-nav button { padding: 6px 14px; font-size: 18px; line-height: 1; }
.day-text { flex: 1; text-align: center; font-weight: bold; font-size: 16px; color: var(--text); }
.count { color: var(--muted); font-size: 13px; }
.row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.hero {
  background: var(--hero); color: #fff; border-radius: 18px; padding: 10px 14px; cursor: pointer;
  margin-bottom: 14px; box-shadow: 0 4px 14px rgba(47,107,76,0.18); position: relative; overflow: hidden;
}
.hero .item { border-color: rgba(255,255,255,0.35); color: #fff; }
.hero .item small { color: rgba(255,255,255,0.9); }
.hero .big { font-size: 16px; font-weight: bold; }
.hero .small { font-size: 12px; opacity: 0.9; margin-top: 2px; }
.grid { display: flex; flex-direction: column; gap: 8px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 8px 12px 8px 8px; cursor: pointer; text-align: left; color: var(--text); width: 100%;
  display: flex; flex-direction: row; align-items: center; gap: 12px; box-shadow: 0 1px 2px rgba(20,40,28,0.06), 0 4px 12px rgba(20,40,28,0.04);
}
.card { content-visibility: auto; contain-intrinsic-size: auto 86px; }
.card .thumb {
  width: 68px; height: 68px; flex-shrink: 0; border-radius: 14px; overflow: hidden;
  background: color-mix(in srgb, var(--c, #d7f0dc) 70%, var(--surface));
  display: flex; align-items: center; justify-content: center; font-size: 36px;
}
.card .thumb img { width: 100%; height: 100%; object-fit: cover; }
.card .info { flex: 1; min-width: 0; }
.card .name { font-weight: bold; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .sub { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .badge { align-self: center; flex-shrink: 0; }
.badge {
  display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); align-self: flex-start;
}
.badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
/* 植物一覧の「登録数・追加」の行は、一覧をスクロールしても上に固定。背景は透かして、一覧が隠れないようにする */
#view-plants .row-head {
  position: sticky; top: -16px; z-index: 4;
  margin: -16px -16px 4px; padding: 12px 16px 14px;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 55%, transparent), transparent);
  pointer-events: none;           /* 行の空きの部分は、下の一覧をそのまま操作できる */
}
#view-plants .row-head > * { pointer-events: auto; }
#view-plants .row-head .count {
  padding: 3px 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 80%, transparent);
}
#view-plants .row-head #addBtn {
  background: color-mix(in srgb, var(--accent) 86%, transparent);
  border: 1px solid color-mix(in srgb, #fff 28%, transparent);
  box-shadow: 0 4px 14px rgba(20,40,28,0.14);
}
.chip {
  display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 999px;
  background: var(--c, #d7f0dc); color: #1f3a26;
}
.btns > button { pointer-events: auto; }
button.primary, button.secondary, button.danger {
  border-radius: 12px; padding: 10px 16px; cursor: pointer; border: 1px solid transparent; font-weight: bold;
}
button.primary { background: var(--accent); color: #fff; box-shadow: none; }
button.secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.cal-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 12px; box-shadow: 0 1px 2px rgba(20,40,28,0.06), 0 4px 12px rgba(20,40,28,0.04); }
.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cal-head .month { font-size: 17px; font-weight: bold; }
.cal-head button { padding: 6px 14px; }
.weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.weekdays div { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; font-weight: bold; }
.weekdays .sun, .cal-cell.sun .num { color: var(--danger); }
.weekdays .sat, .cal-cell.sat .num { color: var(--accent); }
.cal-cell {
  background: var(--bg); border: 1px solid transparent; border-radius: 10px;
  min-height: 52px; padding: 4px 2px; color: var(--text); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.cal-cell.blank { background: none; cursor: default; }
.cal-cell .num { font-size: 14px; }
.cal-cell:hover { border-color: var(--border); }
.cal-cell.today { background: var(--accent); color: #fff; }
.cal-cell.today .num { font-weight: bold; color: #fff; }
.cal-cell.today .dot { background: #ffe066; }
.dots { display: flex; gap: 3px; min-height: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); }
.dots .plus { font-size: 11px; font-weight: bold; line-height: 6px; color: var(--accent2); }
.cal-cell.today .plus { color: #ffe066; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex;
  background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 10;
  box-shadow: 0 -4px 14px rgba(0,0,0,0.05);
}
.tabbar button {
  flex: 1; background: none; border: none; padding: 12px 2px; min-height: 60px; justify-content: center; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; cursor: pointer;
}
.splash { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; transition: opacity .45s ease, visibility .45s; }
.splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
.splash-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.splash-ic { width: 64px; height: 64px; color: var(--accent); animation: pom .75s cubic-bezier(.3,.7,.4,1) 2; transform-origin: 50% 100%; }
.splash-name { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 13px; letter-spacing: .18em; color: var(--muted); }
.splash-dots { display: flex; gap: 6px; }
.splash-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); animation: blink .75s ease-in-out 2; }
.splash-dots span:nth-child(2) { animation-delay: .15s; }
.splash-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes pom {
  0%, 100% { transform: translateY(0) scale(1.08, .92); }
  15% { transform: translateY(0) scale(1, 1); }

<header><h1 id="pageTitle">カレンダー</h1><div class="brand">Verdant Log</div><div class="month-pick" id="monthPickWrap"><button class="pill" id="pickBtn" type="button"><span id="pickYear"></span><span id="pickMonth"></span><span class="caret">▼</span></button><button class="today-btn" id="todayBtn" type="button">今日</button></div></header>

<main>
  <section class="view active" id="view-calendar">
    <div class="hero" id="hero">
      <div class="big" id="heroBig"></div>
      <div class="small" id="heroSmall"></div>
      <div id="heroDetail" style="display:none;margin-top:8px;"></div>
    </div>
    <div class="cal-wrap">
      <div class="cal-head">
        <button class="secondary" id="prevM">‹</button>
        
        <button class="secondary" id="nextM">›</button>
      </div>
      <div class="weekdays">
        <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
      </div>
      <div class="cal-grid" id="calGrid" style="margin-top:4px;"></div>
    </div>
  </section>
  <section class="view" id="view-plants">
    <div class="row-head">
      <div class="count" id="count"></div>
      <button class="primary" id="addBtn">＋ 追加</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;"><svg class="empty-ic" aria-hidden="true"><use href="#i-agave"/></svg>まだ植物が登録されていません。<br>「＋ 追加」から登録してみましょう</div>
  </section>
  <section class="view" id="view-growth">
    <div class="seg" id="gPlantWrap" style="margin-bottom:10px;">
      <button id="gPlantBtn" type="button" class="plant-btn"></button>
    </div>
    <div class="seg" id="gMetric">
      <button data-metric="height" class="active">高さ</button>
      <button data-metric="diameter">直径</button>
    </div>
    <div class="seg" id="gRange">
      <button data-range="1">1ヶ月</button>
      <button data-range="6" class="active">6ヶ月</button>
      <button data-range="12">12ヶ月</button>
    </div>
    <div class="period-nav">
      <button class="secondary" id="gPrev" type="button">‹</button>
      <div id="gPeriodLabel"></div>
      <button class="secondary" id="gNext" type="button">›</button>
    </div>
    <div class="chart-box"><div id="chart"></div></div>
    <div class="g-detail" id="gDetail"></div>
  </section>
  <section class="view" id="view-settings">
    <div class="setting-group">
      <h3>テーマ（配色）</h3>
      <div class="opt-row" id="themeOpts">
        <button data-theme-set="system">自動</button>
        <button data-theme-set="light">ライト</button>
        <button data-theme-set="dark">ダーク</button>
      </div>
    </div>
    <div class="setting-group">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div><h3 style="margin:0;">状態タグ</h3><div class="hint" id="tagCount"></div></div>
        <button class="primary" id="tagManageBtn" type="button" style="flex-shrink:0;">編集</button>
      </div>
    </div>
    <div class="setting-group">
      <h3>バックアップ</h3>
      <div class="hint backup-info" id="backupInfo"></div>
      <div style="margin-top:8px;"><button class="primary" id="exportBtn">データを書き出す</button></div>
      <div id="exportFallback" style="display:none;">
        <textarea class="export-text" id="exportText" readonly></textarea>
        <div style="margin-top:6px;"><button class="secondary" id="copyExport">内容をコピー</button></div>
        <div class="hint">ファイルを保存できない環境のため、内容をコピーして保存してください。</div>
      </div>
      <h3 class="sub-h">読み込み</h3>
      <input type="file" id="importFile" accept="application/json,.json">
      <div class="hint">読み込むと、今のデータは選んだファイルの内容に置き換わります。</div>
    </div>
    <div class="setting-group">
      <h3>データ</h3>
      <div class="hint" id="dataInfo"></div>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="calendar" class="active" aria-label="カレンダー"><span class="ico"><svg class="tab-ic" aria-hidden="true"><use href="#i-calendar"/></svg></span></button>
  <button data-tab="plants" aria-label="植物一覧"><span class="ico"><svg class="tab-ic" aria-hidden="true"><use href="#i-plant"/></svg></span></button>
  <button data-tab="growth" aria-label="成長グラフ"><span class="ico"><svg class="tab-ic" aria-hidden="true"><use href="#i-chart"/></svg></span></button>
  <button data-tab="settings" aria-label="設定"><span class="ico"><svg class="tab-ic" aria-hidden="true"><use href="#i-gear"/></svg></span></button>
</nav>

<div class="overlay" id="editOverlay" style="z-index:21;">
  <div class="sheet">
    <h2 id="editTitle">植物を追加</h2>
    <label>名前</label>
    <input type="text" id="fName" maxlength="30">
    <label>アイコン写真（任意）</label>
    <div class="photo-row">
      <input type="file" id="fPhoto" accept="image/*">
      <img id="fPhotoPreview" class="photo-preview" alt="" style="display:none;">
      <button class="secondary" id="fPhotoClear" type="button" style="display:none;">外す</button>
    </div>
    <div class="tabs" style="margin-top:10px;">
      <button id="typeSelectTab" type="button" class="active">大分類・品種から選ぶ</button>
      <button id="typeTextTab" type="button">自由に入力</button>
    </div>
    <div id="selectMode">
      <div class="two">
        <div><label>大分類</label><select id="fCat"></select></div>
        <div><label>品種</label><select id="fVar"></select></div>
      </div>
      <input type="text" id="fVarOther" maxlength="30" style="display:none;margin-top:8px;">
    </div>
    <div id="textMode" style="display:none;">
      <input type="text" id="fTypeText" maxlength="30">
    </div>
    <div class="two">
      <div><label>購入日・迎えた日</label><input type="date" id="fAcquired"></div>
      <div><label>水やり間隔（日）</label><input type="number" id="fInterval" min="1" max="365"></div>
    </div>
    <label>メモ</label>
    <textarea id="fMemo" maxlength="300"></textarea>
    <div class="btns">
      <button class="secondary" id="editCancel">キャンセル</button>
      <button class="primary" id="editSave">保存</button>
    </div>
  </div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="sheet">
    <div id="detailBody"></div>
    <div class="btns">
      <button class="danger" id="deleteBtn">削除</button>
      <button class="secondary" id="editBtn">編集</button>
      <button class="secondary" id="detailClose">閉じる</button>
    </div>
  </div>
</div>

<div class="overlay" id="historyOverlay">
  <div class="sheet">
    <h2 id="historyTitle"></h2>
    <div id="historyBody"></div>
    <div class="btns"><button class="secondary" id="historyClose">閉じる</button></div>
  </div>
</div>

<div class="overlay" id="diaryOverlay">
  <div class="sheet">
    <h2>成長日記を書く</h2>
    <label>日付</label>
    <input type="date" id="dDate">
    <label>写真</label>
    <input type="file" id="dPhoto" accept="image/*">
    <label>内容</label>
    <textarea id="dText" maxlength="500"></textarea>
    <div class="btns">
      <button class="secondary" id="diaryCancel">キャンセル</button>
      <button class="primary" id="diarySave">保存</button>
    </div>
  </div>
</div>

<div class="overlay" id="dayOverlay">
  <div class="sheet">
    <div class="row-head" style="align-items:center;"><h2 id="dayTitle" style="margin:0;"></h2><button class="primary" id="dayAdd">＋ 記録する</button></div>
    <div id="dayBody"></div>
    <div class="btns">
      <button class="secondary" id="dayClose">閉じる</button>
    </div>
  </div>
</div>

<div class="overlay" id="pickOverlay" style="z-index:21;">
  <div class="sheet">
    <h2>お世話の記録</h2>
    <div id="pickPlants" style="margin-top:8px;"></div>
    <div class="section"><h3>内容</h3><div class="action-grid" id="pickActions"></div></div>
    <div class="btns"><button class="secondary" id="pickCancel">キャンセル</button><button class="primary" id="pickSave" disabled>保存</button></div>
  </div>
</div>

<div class="overlay" id="wheelOverlay">
  <div class="sheet" style="max-width:340px;margin-top:auto;margin-bottom:auto;border-radius:20px;">
    <div class="wheel-head">
      <button class="secondary" id="wheelCancel">キャンセル</button>
      <button class="primary" id="wheelOk">決定</button>
    </div>
    <div class="wheel-box">
      <div class="wheel-band"></div>
      <div class="wheel" id="wheelY"></div>
      <div class="wheel" id="wheelM"></div>
    </div>
  </div>
</div>

<div class="overlay" id="plantPickOverlay">
  <div class="sheet">
    <h2>植物を選ぶ</h2>
    <div id="gPickList" style="margin-top:8px;"></div>
    <div class="btns"><button class="secondary" id="gPickCancel">閉じる</button></div>
  </div>
</div>

<div class="overlay" id="logOverlay" style="z-index:22;">
  <div class="sheet">
    <h2 id="logTitle">記録する</h2>
    <div class="day-nav">
      <button class="secondary" id="lPrev" type="button">‹</button>
      <div class="day-text" id="lDateText"></div>
      <button class="secondary" id="lNext" type="button">›</button>
    </div>
    <input type="date" id="lDate" style="display:none;">
    <label>植物</label>
    <select id="lPlant"></select>
    <label>内容</label>
    <select id="lAction"></select>
    <div id="lMemoBox">
      <label>メモ</label>
      <textarea id="lMemo" maxlength="200"></textarea>
    </div>
    <label>写真</label>
    <div class="photo-row">
      <input type="file" id="lPhoto" accept="image/*">
      <img id="lPhotoPreview" class="photo-preview" alt="">
      <button class="secondary" id="lPhotoClear" type="button" style="display:none;">外す</button>
    </div>
    <div class="size-row"><span>高さ</span><input type="number" id="lHeight" min="0" max="99999" step="1"><span>mm</span></div>
    <div class="size-row"><span>直径</span><input type="number" id="lDia" min="0" max="99999" step="1"><span>mm</span></div>
    <div id="lTagsBox">
      <button type="button" class="fold-label" id="lTagsToggle"><span>状態</span><span id="lTagsCaret">▼</span><span id="lTagsSel"></span></button>
      <div id="lTagsBody" style="display:none;"><div class="tag-wrap" id="lTags"></div></div>
    </div>
    <div class="btns">
      <button class="secondary" id="logCancel">キャンセル</button>
      <button class="primary" id="logSave">保存</button>
    </div>
  </div>
</div>

<div class="overlay lightbox" id="photoOverlay">
  <div class="frame">
    <img id="photoImg" alt="">
    <div class="cap" id="photoCap"></div>
    <div class="btns" style="justify-content:center;"><button class="secondary" id="photoClose">閉じる</button></div>
  </div>
</div>

<div class="overlay" id="askOverlay" style="z-index:30;">
  <div class="sheet" style="max-width:420px;border-radius:18px;margin-bottom:auto;margin-top:auto;">
    <h2 id="askMsg" style="color:var(--text);"></h2>
    <div class="btns">
      <button class="secondary" id="askNo">いいえ</button>
      <button class="danger" id="askYes" style="background:var(--danger);color:#fff;border-color:var(--danger);">はい、実行する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="tagOverlay" style="z-index:21;">
  <div class="sheet">

      <input type="text" id="tagNew" maxlength="12">
      <button class="primary" id="tagAdd" type="button">追加</button>
    </div>
    <div id="tagList" style="margin-top:12px;"></div>
    <div class="btns">
      <button class="secondary" id="tagClose">閉じる</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ===== 定数（上限数・保存名・記録の種類・写真サイズなど） =====
  const LEGACY_KEY = "plantManager.v1";   // 旧アプリの保存名（読み取り専用で引き継ぎに使う）
  const LS_KEY2 = "verdantLog2.v1";       // IndexedDBが使えない場合の予備
  const DB_NAME = "verdantLog2";
  const DB_STORE = "kv";
  const DB_PHOTOS = "photos";   // 写真だけを別に保存する場所（記録の読み書きを軽くするため）
  const DB_VERSION = 2;
  const OTHER = "その他";
  const OTHER_VAR = "__other";
  const ACTIONS = ["水やり", "植え替え", "肥料", "剪定", "様子メモ", "その他"];
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  const PHOTO_MAX = 480;      // 写真の最大辺(px)。容量を抑えるため小さめに圧縮
  const PHOTO_Q = 0.7;

  // ===== 植物の分類カタログ（大分類→品種）とアイコン生成 =====
  const svgIcon = (id) => '<svg class="ic" aria-hidden="true"><use href="#i-' + id + '"/></svg>';
  const CATS = {
    "観葉植物": { icon: svgIcon("foliage"), color: "#d7f0dc", items: [

  const CAT_ORDER = ["サボテン", "塊根植物", "多肉植物", "観葉植物", "ヤシ類", "シダ類", "常緑樹"];

  // ===== アプリ全体の状態（植物・記録・設定と画面の選択状態） =====

  const pad = (n) => String(n).padStart(2, "0");

  const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ===== 状態タグ（記録に付けるタグの一覧と共通の処理） =====

  // ===== 写真の縮小処理 =====
  function resizeImage(file, maxSize, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("read"));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("img"));
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.width * scale));
          c.height = Math.max(1, Math.round(img.height * scale));
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  ["editOverlay", "detailOverlay", "historyOverlay", "diaryOverlay", "dayOverlay", "pickOverlay", "wheelOverlay", "plantPickOverlay", "logOverlay", "photoOverlay", "tagOverlay"].forEach((id) => {

  // ===== 左から右へのスワイプで1つ前の画面へ戻る =====
  // ---------- 左から右へのスワイプで1つ前の画面へ戻る（記録・植物の追加/編集・記録する植物選択） ----------
  ["editOverlay", "pickOverlay", "logOverlay"].forEach((id) => {
    const el = $(id);
    let sx = 0, sy = 0, st = 0, active = false;
    el.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1) { active = false; return; }
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
      st = Date.now();
      active = true;
    }, { passive: true });
    el.addEventListener("touchend", (e) => {
      if (!active) return;
      active = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (dx > 80 && Math.abs(dy) < 60 && Date.now() - st < 700) {
        if (isField(document.activeElement)) document.activeElement.blur();
        closeOverlay(id);
      }
    }, { passive: true });
  });
  // ===== 画面の一番上で下へ引っ張ると閉じる（左右スワイプで戻れない画面向け） =====
  ["detailOverlay", "historyOverlay", "diaryOverlay", "dayOverlay", "plantPickOverlay", "tagOverlay"].forEach((id) => {
    const sheet = $(id).querySelector(".sheet");
    const CLOSE_AT = 120;          // この距離（px）引っ張ったら閉じる
    let sx = 0, sy = 0, atTop = false, pulling = false, pullY = 0, raf = 0;
    function snapBack() {
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      sheet.style.transition = "transform .2s ease";
      sheet.style.transform = "";
      setTimeout(() => { if (!pulling) sheet.style.willChange = ""; }, 260);
    }
    sheet.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1) { atTop = false; return; }
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
      atTop = sheet.scrollTop <= 0;
      pulling = false;
    }, { passive: true });
    sheet.addEventListener("touchmove", (e) => {
      if (!atTop) return;
      // タグの並べ替え中は、引っ張りで閉じない
      if (sheet.querySelector(".sorting")) { atTop = false; return; }
      const dy = e.touches[0].clientY - sy;
      const dx = e.touches[0].clientX - sx;
      if (!pulling) {
        // 下向きで、横より縦の動きが大きいときだけ引っ張りとして扱う
        if (dy <= 8 || Math.abs(dx) > dy) return;
        pulling = true;
        if (isField(document.activeElement)) document.activeElement.blur();
      }
      if (e.cancelable) e.preventDefault();
      pullY = Math.max(0, (dy - 8) * 0.6);
      if (!raf) raf = requestAnimationFrame(() => {
        raf = 0;
        sheet.style.willChange = "transform";
        sheet.style.transition = "none";
        sheet.style.transform = "translate3d(0," + pullY + "px,0)";
      });
    }, { passive: false });
    sheet.addEventListener("touchend", (e) => {
      if (!pulling) return;
      pulling = false;
      atTop = false;
      const dy = e.changedTouches[0].clientY - sy;
      if (dy - 8 >= CLOSE_AT) {
        // 画面を下へ滑り落としてから閉じる
        if (isField(document.activeElement)) document.activeElement.blur();
        sheet.style.transition = "transform .24s cubic-bezier(.4,0,1,1)";
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
        sheet.style.transform = "translate3d(0," + (window.innerHeight + 40) + "px,0)";
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          sheet.style.transition = "none";
          sheet.style.transform = "";
          sheet.style.willChange = "";
          closeOverlay(id);
        };
        sheet.addEventListener("transitionend", finish, { once: true });
        setTimeout(finish, 320);
      } else {
        snapBack();
      }
    }, { passive: true });
    sheet.addEventListener("touchcancel", () => { pulling = false; atTop = false; snapBack(); }, { passive: true });
  });

  // ===== 拡大・縮小の無効化 =====
  // ---------- 拡大・縮小の無効化 ----------
  ["gesturestart", "gesturechange", "gestureend"].forEach((t) => {

  // ===== 写真の保存（記録とは別の場所に保存し、必要なときだけ読み込む） =====
  // ---------- 写真 ----------
  // 記録や植物の中には、写真の代わりに「ph:番号」という目印だけを入れておく。
  // 写真の本体は別の保存場所にあり、画面に出すときだけ読み込む。
  const photoCache = new Map();   // 番号 → 写真のデータ（一度読んだものを覚えておく）
  let pending = new Map();        // まだ保存していない新しい写真（番号 → データ）
  const storedIds = new Set();    // 保存場所にある写真の番号一覧

  function eachPhotoSlot(data, fn) {
    (data.plants || []).forEach((p) => {
      if (p.photo) fn(p);
      (p.diary || []).forEach((d) => { if (d.photo) fn(d); });
    });
    (data.logs || []).forEach((l) => { if (l.photo) fn(l); });
  }

  function photoImg(ref, extra) {
    if (!ref) return "";
    const attrs = extra ? " " + extra : "";
    if (ref.startsWith("ph:")) return '<img data-ph="' + ref.slice(3) + '" alt=""' + attrs + '>';
    return '<img src="' + ref + '" alt=""' + attrs + '>';
  }

  // 写真のデータを取り出す（まだ保存場所から読んでいなければ読み込む）
  function getPhotoSrc(ref) {
    if (!ref) return Promise.resolve(null);
    if (!ref.startsWith("ph:")) return Promise.resolve(ref);
    const id = ref.slice(3);
    if (photoCache.has(id)) return Promise.resolve(photoCache.get(id));
    if (!db || useLS) return Promise.resolve(null);
    return new Promise((resolve) => {
      try {
        const r = db.transaction(DB_PHOTOS, "readonly").objectStore(DB_PHOTOS).get(id);
        r.onsuccess = () => { if (r.result) photoCache.set(id, r.result); resolve(r.result || null); };
        r.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  }

  // 画面に追加された写真の目印を、実際の写真に差し替える
  function fillPhotoImgs(root) {
    if (!root || root.nodeType !== 1) return;
    const imgs = [];
    if (root.matches && root.matches("img[data-ph]")) imgs.push(root);
    root.querySelectorAll("img[data-ph]").forEach((i) => imgs.push(i));
    imgs.forEach((img) => {
      const id = img.dataset.ph;
      getPhotoSrc("ph:" + id).then((src) => { if (src && img.dataset.ph === id) { img.src = src; img.removeAttribute("data-ph"); } });
    });
  }
  function initPhotos() {
    new MutationObserver((list) => {
      list.forEach((m) => m.addedNodes.forEach((n) => fillPhotoImgs(n)));
    }).observe(document.body, { childList: true, subtree: true });
  }

  // 保存のときに、写真の本体を別の保存場所へ移し、記録側には目印だけを残す
  function externalizePhotos() {
    eachPhotoSlot(state, (o) => {
      if (o.photo.startsWith("data:")) {
        const id = uid();
        pending.set(id, o.photo);
        photoCache.set(id, o.photo);
        o.photo = "ph:" + id;
      }
    });
  }
  function usedPhotoIds() {
    const used = new Set();
    eachPhotoSlot(state, (o) => { if (o.photo.startsWith("ph:")) used.add(o.photo.slice(3)); });
    return used;
  }
  // バックアップ用：写真の本体を含んだ形でデータを作る（ファイルの形式は従来どおり）
  async function portableData() {
    const data = JSON.parse(JSON.stringify({ plants: state.plants, logs: state.logs, settings: state.settings }));
    const slots = [];
    eachPhotoSlot(data, (o) => slots.push(o));
    for (const o of slots) {
      if (o.photo.startsWith("ph:")) o.photo = (await getPhotoSrc(o.photo)) || null;
    }
    return data;
  }

  // ===== 保存・読み込み（IndexedDB／予備のlocalStorage／旧データの引き継ぎ） =====
  // ---------- 保存・読み込み ----------
  function migrate() {
    state.plants.forEach((p) => {
      if (p.category === undefined) {
        if (CATS[p.type]) { p.category = p.type; p.type = ""; }
        else { p.category = OTHER; }
      }
    });
    // タグ「虫がいた」を「虫」に変更（一度だけ）
    if (!state.settings.tagRename1) {
      const ren = (t) => (t === "虫がいた" ? "虫" : t);
      const uniq = (a) => a.filter((t, i) => a.indexOf(t) === i);
      if (Array.isArray(state.settings.tags)) state.settings.tags = uniq(state.settings.tags.map(ren));
      state.logs.forEach((l) => { if (Array.isArray(l.tags)) l.tags = uniq(l.tags.map(ren)); });
      state.settings.tagRename1 = true;
    }
    state.logs.forEach((l) => { if (l.height === undefined) l.height = null; if (l.diameter === undefined) l.diameter = null; });
  }
  let db = null, useLS = false, writing = false, dirty = false;

  function openDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error("noidb")); return; }
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE);
        if (!d.objectStoreNames.contains(DB_PHOTOS)) d.createObjectStore(DB_PHOTOS);
      };
      req.onsuccess = () => {
        const d = req.result;
        // 別のタブで古い版が開いていても、そちらを閉じて新しい版に譲る
        d.onversionchange = () => d.close();
        resolve(d);
      };
      req.onerror = () => reject(req.error);
      // 他で開いている間は待つ（失敗扱いにすると、保存先が変わってしまうため）
      req.onblocked = () => {};
    });
  }
  function dbReadAll() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([DB_STORE, DB_PHOTOS], "readonly");
      const st = tx.objectStore(DB_STORE);
      const out = {};
      ["plants", "logs", "settings"].forEach((k) => {
        const r = st.get(k);
        r.onsuccess = () => { out[k] = r.result; };
      });
      // 写真は中身を読まず、番号の一覧だけ覚えておく（起動を軽くするため）
      tx.objectStore(DB_PHOTOS).getAllKeys().onsuccess = (e) => {
        storedIds.clear();
        e.target.result.forEach((id) => storedIds.add(String(id)));
      };
      tx.oncomplete = () => resolve(out);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  }
  function dbWriteAll(snap, photos, removeIds) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction([DB_STORE, DB_PHOTOS], "readwrite");
      const st = tx.objectStore(DB_STORE);
      st.put(snap.plants, "plants");
      st.put(snap.logs, "logs");
      st.put(snap.settings, "settings");
      const ps = tx.objectStore(DB_PHOTOS);
      photos.forEach((v, id) => ps.put(v, id));
      removeIds.forEach((id) => ps.delete(id));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  }
  // 書き込み中に次の保存が来たら、終わってから最新の内容でもう一度書く
  function flush() {
    if (!db) return;
    if (writing) { dirty = true; return; }
    writing = true;
    dirty = false;
    externalizePhotos();
    const used = usedPhotoIds();
    const batch = new Map();
    pending.forEach((v, id) => { if (used.has(id)) batch.set(id, v); });
    pending = new Map();
    const removeIds = [...storedIds].filter((id) => !used.has(id));
    dbWriteAll({ plants: state.plants, logs: state.logs, settings: state.settings }, batch, removeIds)
      .then(() => {
        removeIds.forEach((id) => storedIds.delete(id));
        batch.forEach((_, id) => storedIds.add(id));
        writing = false;
        if (dirty) flush();
      })
      .catch(() => {
        batch.forEach((v, id) => pending.set(id, v));
        writing = false;
        toast("保存できませんでした。空き容量や設定をご確認ください");
      });
  }
  function save() {
    if (useLS) {
      try { localStorage.setItem(LS_KEY2, JSON.stringify(state)); return true; }
      catch (e) { toast("容量がいっぱいです。写真を減らすか、古い記録を整理してください"); return false; }
    }
    flush();
    return true;
  }
  async function loadData() {
    let d = null, imported = false;
    try { db = await openDB(); } catch (e) { db = null; useLS = true; }
    if (db) {
      try {
        const r = await dbReadAll();
        if (Array.isArray(r.plants)) d = { plants: r.plants, logs: Array.isArray(r.logs) ? r.logs : [], settings: r.settings };
      } catch (e) { /* 読めない場合は空で開始 */ }
    } else {
      try {
        const raw = localStorage.getItem(LS_KEY2);
        if (raw) d = JSON.parse(raw);
      } catch (e) { /* 空で開始 */ }
    }
    if (!d || !Array.isArray(d.plants)) {
      // 初回のみ：旧アプリのデータが同じ保存領域にあれば、コピーして引き継ぐ（旧アプリ側は変更しない）
      try {
        const raw = localStorage.getItem(LEGACY_KEY);
        if (raw) {
          const o = JSON.parse(raw);
          if (o && Array.isArray(o.plants)) { d = o; imported = true; }
        }
      } catch (e) { /* 引き継ぎなし */ }
    }
    if (d && Array.isArray(d.plants)) {
      state.plants = d.plants;
      state.logs = Array.isArray(d.logs) ? d.logs : [];
      if (d.settings) state.settings = Object.assign(state.settings, d.settings);
    }
    const hadTagFlag = !!state.settings.tagRename1;
    migrate();
    if (!hadTagFlag && d) imported = true;
    // 写真がまだ記録の中に直接入っている場合も、別の保存場所へ移すために一度保存する
    let inline = false;
    eachPhotoSlot(state, (o) => { if (o.photo.startsWith("data:")) inline = true; });
    if (imported || inline) save();
    // ブラウザに、保存データを勝手に消さないよう依頼する
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* 未対応 */ }
  }

  function fillMonthPick() {

  function fillWheel(id, from, to, suffix) {
    const el = $(id);
    el.dataset.from = from;
    let html = "";
    for (let v = from; v <= to; v++) html += '<div class="wi">' + v + suffix + '</div>';
    el.innerHTML = html;
  }
  function wheelValue(id) {
    const el = $(id);
    const idx = Math.round(el.scrollTop / 40);
    const max = el.children.length - 1;
    return Number(el.dataset.from) + Math.max(0, Math.min(max, idx));
  }
  // 選択中の行の強調：動いたときだけ、前後の2行だけを更新する（スクロール中の負荷を減らす）
  const wheelOn = {};
  function markWheel(id) {
    const el = $(id);
    const idx = wheelValue(id) - Number(el.dataset.from);
    if (wheelOn[id] === idx && el.children[idx] && el.children[idx].classList.contains("on")) return;
    const prev = el.querySelector(".wi.on");
    if (prev) prev.classList.remove("on");
    if (el.children[idx]) el.children[idx].classList.add("on");
    wheelOn[id] = idx;
  }
  const wheelTick = {};
  function markWheelSoon(id) {
    if (wheelTick[id]) return;
    wheelTick[id] = requestAnimationFrame(() => { wheelTick[id] = 0; markWheel(id); });
  }
  function scrollWheelTo(id, value) {
    const el = $(id);
    el.scrollTop = (value - Number(el.dataset.from)) * 40;
    markWheel(id);
  }

    let html = "";
    for (let i = 0; i < first; i++) html += '<div class="cal-cell blank"></div>';
    for (let d = 1; d <= days; d++) {

    $("calGrid").innerHTML = html;

  // ===== 成長グラフ =====
  // ---------- 成長グラフ ----------
  let gSel = null, gHit = null;   // 選んでいる点の記録ID／点の位置（タップ判定用）
  // きりのよい目盛りを作る（例：38〜52 → 36,40,44,48,52）
  function niceTicks(lo, hi) {
    const span = Math.max(hi - lo, 1);
    const raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    const step = Math.max(1, (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * mag);
    const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
    for (let v = a; v <= b + 1e-9; v += step) t.push(v);
    return t;
  }
  // 選んだ点の記録内容（日付・データ・内容だけを簡素に表示）
  function renderGrowthDetail(p, l) {
    const [y, m, d] = l.date.split("-").map(Number);
    $("gDetail").innerHTML =
      '<div class="g-d-top"><b>' + y + "年" + m + "月" + d + "日（" + WD[new Date(y, m - 1, d).getDay()] + '）</b>' +
      '<span class="g-d-act">' + escapeHtml(l.action) + '</span></div>' +
      '<div class="g-d-data">' + escapeHtml(measureText(l)) + '</div>';
  }
  function renderGrowthSelect() {
    if (!state.plants.some((p) => p.id === gPlantId)) gPlantId = state.plants.length ? state.plants[0].id : null;
    const p = state.plants.find((x) => x.id === gPlantId);
    $("gPlantBtn").innerHTML = p
      ? CATS[catOf(p)].icon + " " + escapeHtml(p.name) + ' <span class="caret">▼</span>'
      : '植物を選ぶ <span class="caret">▼</span>';
    document.querySelectorAll("#gMetric button").forEach((b) => b.classList.toggle("active", b.dataset.metric === gMetric));
    document.querySelectorAll("#gRange button").forEach((b) => b.classList.toggle("active", Number(b.dataset.range) === gRange));
    $("gNext").disabled = gShift >= 0;
  }
  function fmtSlash(d) { return d.slice(0, 4) + "/" + d.slice(5, 7) + "/" + d.slice(8, 10); }
  function renderGrowth() {
    renderGrowthSelect();
    const p = state.plants.find((x) => x.id === gPlantId);
    const now = new Date();
    const endDate = new Date(now.getFullYear(), now.getMonth() + gShift * gRange, now.getDate());
    const cutoffDate = new Date(endDate.getFullYear(), endDate.getMonth() - gRange, endDate.getDate());
    const endS = ymd(endDate.getFullYear(), endDate.getMonth(), endDate.getDate());
    const cutS = ymd(cutoffDate.getFullYear(), cutoffDate.getMonth(), cutoffDate.getDate());
    $("gPeriodLabel").textContent = fmtSlash(cutS) + " 〜 " + fmtSlash(endS);

    if (!p) {
      $("chart").innerHTML = '<div class="empty">植物を登録すると、ここで成長の推移を確認できます。</div>';
      $("gDetail").innerHTML = ""; gHit = null;
      return;
    }
    const label = gMetric === "height" ? "高さ" : "直径";
    const pts = state.logs
      .filter((l) => l.plantId === p.id && l[gMetric] && l.date >= cutS && l.date <= endS)
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    if (pts.length === 0) {
      $("chart").innerHTML = '<div class="empty" style="padding:30px 0;">この期間の「' + label + '」の記録はありません。<br>記録画面で' + label + 'を入れると、ここにグラフが表示されます。</div>';
      $("gDetail").innerHTML = ""; gHit = null;
      return;
    }

    // SVGで折れ線グラフを描く（外部ライブラリ不要）
    const W = 320, padL = 54, padR = 14, padT = 14, plotH = 160;
    const vals = pts.map((l) => l[gMetric]);
    const times = pts.map((l) => new Date(l.date + "T00:00:00").getTime());
    const t0 = cutoffDate.getTime();
    const t1 = new Date(endS + "T00:00:00").getTime();
    const dayT = (d) => new Date(d + "T00:00:00").getTime();
    const xOf = (t) => padL + (W - padL - padR) * ((t - t0) / Math.max(1, t1 - t0));

    // 縦軸：0からではなく、記録の範囲に合わせて目盛りを決める
    const minV = Math.min.apply(null, vals), maxV = Math.max.apply(null, vals);
    const pad = (maxV - minV) * 0.2 || Math.max(2, maxV * 0.1);
    const ticksY = niceTicks(Math.max(0, minV - pad), maxV + pad);
    const yLo = ticksY[0], yHi = ticksY[ticksY.length - 1];
    const yOf = (v) => padT + plotH * (1 - (v - yLo) / Math.max(1, yHi - yLo));

    const axisY = padT + plotH + 4;
    const H = axisY + 20;

    let svg = '<svg viewBox="0 0 ' + W + " " + H + '" xmlns="http://www.w3.org/2000/svg" id="gSvg">';
    ticksY.forEach((v) => {
      const y = yOf(v);
      svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" style="stroke:var(--border)" stroke-width="1"/>';
      svg += '<text x="' + (padL - 6) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="10" style="fill:var(--muted)">' + v + '</text>';
    });
    svg += '<text x="' + padL + '" y="' + (padT - 4) + '" font-size="10" style="fill:var(--muted)">mm</text>';

    // 横軸の目盛り：1ヶ月は週ごと、6・12ヶ月は月の初めごと（文字が重ならないよう間引く）
    const xt = [];
    if (gRange === 1) {
      for (let t = t0; t <= t1; t += 7 * 86400000) { const d = new Date(t); xt.push({ t, label: (d.getMonth() + 1) + "/" + d.getDate() }); }
    } else {
      const d = new Date(cutoffDate.getFullYear(), cutoffDate.getMonth() + 1, 1);
      while (d.getTime() <= t1) { xt.push({ t: d.getTime(), label: (d.getMonth() + 1) + "月" }); d.setMonth(d.getMonth() + 1); }
    }
    const minGap = 34;
    let lastLabelX = -1e9;
    xt.forEach((k) => {
      const x = xOf(k.t);
      svg += '<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="' + padT + '" y2="' + (padT + plotH) + '" style="stroke:var(--border)" stroke-width="1" stroke-dasharray="2 3"/>';
      svg += '<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="' + (axisY - 2) + '" y2="' + (axisY + 2) + '" style="stroke:var(--muted)" stroke-width="1"/>';
      if (x - lastLabelX >= minGap && x >= padL + 12 && x <= W - padR - 12) {
        svg += '<text x="' + x.toFixed(1) + '" y="' + (axisY + 15) + '" text-anchor="middle" font-size="10" style="fill:var(--muted)">' + k.label + '</text>';
        lastLabelX = x;
      }
    });
    svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + axisY + '" y2="' + axisY + '" style="stroke:var(--border)" stroke-width="1"/>';

    // 選んだ点の縦線と、折れ線・点
    const sel = pts.find((l) => l.id === gSel) || pts[pts.length - 1];
    gSel = sel.id;
    const selX = xOf(dayT(sel.date));
    svg += '<line x1="' + selX.toFixed(1) + '" x2="' + selX.toFixed(1) + '" y1="' + padT + '" y2="' + (axisY) + '" style="stroke:var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>';
    const coords = pts.map((l, i) => xOf(times[i]).toFixed(1) + "," + yOf(l[gMetric]).toFixed(1));
    if (pts.length > 1) svg += '<polyline points="' + coords.join(" ") + '" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--accent)"/>';
    pts.forEach((l, i) => {
      const x = xOf(times[i]), y = yOf(l[gMetric]);
      if (l.id === sel.id) svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="9" style="fill:var(--accent-soft);stroke:var(--accent)" stroke-width="1.5"/>';
      svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"/>';
    });
    svg += "</svg>";
    $("chart").innerHTML = svg + '<div class="hint g-note">点をタップすると詳細を表示（縦軸は記録の範囲に合わせています）</div>';
    gHit = { W, H, pts: pts.map((l, i) => ({ id: l.id, x: xOf(times[i]), y: yOf(l[gMetric]) })) };
    renderGrowthDetail(p, sel);
  }

  // グラフをタップすると、いちばん近い点を選ぶ
  $("chart").addEventListener("click", (e) => {
    const svg = $("gSvg");
    if (!svg || !gHit) return;
    const r = svg.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (gHit.W / r.width), my = (e.clientY - r.top) * (gHit.H / r.height);
    let best = null, bd = 1e9;
    gHit.pts.forEach((q) => { const dd = Math.hypot(q.x - mx, q.y - my); if (dd < bd) { bd = dd; best = q; } });
    if (best && bd <= 44 && best.id !== gSel) { gSel = best.id; renderGrowth(); }
  });

      const n = Math.max(0, daysBetween(last, todayStr()));
      text = "最終バックアップ：" + (n === 0 ? "今日" : n + "日前") + "（" + last.replace(/-/g, "/") + "）";

  function saveEdit() {
    const name = $("fName").value.trim();
    if (!name) { toast("名前を入力してください"); return; }
    let category, type;
    if ($("typeSelectTab").classList.contains("active")) {
      category = $("fCat").value;
      type = $("fVar").value === OTHER_VAR ? $("fVarOther").value.trim() : $("fVar").value;
      if (category === OTHER && !type) { toast("品種名を入力してください"); return; }
    } else {
      category = OTHER;
      type = $("fTypeText").value.trim();
    }
    const intervalRaw = $("fInterval").value.trim();
    let waterInterval = null;
    if (intervalRaw !== "") {
      const n = Math.floor(Number(intervalRaw));
      if (!Number.isFinite(n) || n < 1 || n > 365) { toast("水やり間隔は1〜365の数字で入力してください"); return; }
      waterInterval = n;
    }
    const data = {
      name, category, type,
      acquired: $("fAcquired").value || null,
      waterInterval,
      memo: $("fMemo").value.trim(),
      photo: editPhoto,
    };

      const p = state.plants.find((x) => x.id === editingId);
      if (p) Object.assign(p, data);
      toast("更新しました");

      state.plants.push(Object.assign({ id: uid(), photo: null, lastWatered: null, diary: [], createdAt: todayStr() }, data));

    renderAll();

  // ---------- 記録の選択画面 ----------
  const ACTION_STYLE = {
    "水やり": { i: svgIcon("drop"), c: "#cfe8ff" }, "植え替え": { i: svgIcon("plant"), c: "#f3e3d3" },
    "肥料": { i: svgIcon("fertilizer"), c: "#fff3c4" }, "剪定": { i: svgIcon("scissors"), c: "#d7f0dc" },
    "様子メモ": { i: svgIcon("note"), c: "#ffd9e4" }, "その他": { i: svgIcon("sparkle"), c: "#e6e9ef" }
  };
  let pickDate = null, pickPlantIds = [], pickAction = null;
  function openPicker(date, presetPlantId) {
    if (state.plants.length === 0) { toast("先に植物を登録してください"); return; }
    pickDate = date;
    pickPlantIds = presetPlantId ? [presetPlantId] : [];

    renderPicker();
    $("pickOverlay").classList.add("open");
    $("pickPlants").scrollTop = 0;
    $("pickPlants").classList.remove("scrolled");

  function renderPicker() {
    $("pickPlants").innerHTML = state.plants.map((p) => {
      const photo = p.photo || latestLogPhoto(p.id);
      const thumb = photo ? photoImg(photo) : CATS[catOf(p)].icon;
      return '<div class="pick-row' + (pickPlantIds.includes(p.id) ? ' selected' : '') + '" data-pick="' + p.id + '" style="' + plantStyle(p) + '">' +
        '<div class="pick-avatar">' + thumb + '</div>' +
        '<div class="pick-name">' + escapeHtml(p.name) + '</div>' +
        '<div class="radio"></div></div>';
    }).join("");
    const multi = pickPlantIds.length > 1;
    const hiddenWhenMulti = ["様子メモ", "その他"];
    if (multi && hiddenWhenMulti.includes(pickAction)) pickAction = null;
    $("pickSave").disabled = !(pickAction && pickPlantIds.length >= 1);
    $("pickSave").textContent = "記録";
    $("pickActions").innerHTML = ACTIONS.filter((a) => !(multi && hiddenWhenMulti.includes(a))).map((a) =>
      '<button class="action-tile' + (pickAction === a ? ' on' : '') + '" data-action="' + a + '" style="--c:' + ACTION_STYLE[a].c + ';">' +
      '<span class="ei">' + ACTION_STYLE[a].i + '</span>' + a + '</button>').join("");
  }

  $("pickPlants").addEventListener("scroll", () => $("pickPlants").classList.toggle("scrolled", $("pickPlants").scrollTop > 2), { passive: true });
  $("pickCancel").onclick = () => { pickAction = null; closeOverlay("pickOverlay"); };
  $("pickPlants").onclick = (e) => {
    const r = e.target.closest("[data-pick]");
    if (!r) return;
    const id = r.dataset.pick;
    pickPlantIds = pickPlantIds.includes(id) ? pickPlantIds.filter((x) => x !== id) : pickPlantIds.concat(id);
    renderPicker();
  };
  $("pickActions").onclick = (e) => {
    const b = e.target.closest("[data-action]");
    if (!b) return;
    const action = b.dataset.action;
    if (pickPlantIds.length === 0) { pickAction = action; renderPicker(); return; }
    if (pickPlantIds.length === 1) {
      openLog(pickDate, null, pickPlantIds[0], action);
      return;
    }
    pickAction = action;
    renderPicker();
  };
  $("pickSave").onclick = () => {
    if (!pickAction || pickPlantIds.length < 1) return;
    if (pickPlantIds.length === 1) {
      openLog(pickDate, null, pickPlantIds[0], pickAction);
      return;
    }
    const action = pickAction;
    // 複数選択時は日付と内容だけをまとめて記録（サイズ・写真・メモは入れない）
    pickPlantIds.forEach((id) => {
      state.logs.push({ id: uid(), date: pickDate, plantId: id, action, memo: "", height: null, diameter: null, photo: null });
      if (action === "水やり") {
        const p = state.plants.find((x) => x.id === id);
        if (p && (!p.lastWatered || pickDate > p.lastWatered)) p.lastWatered = pickDate;
      }
    });
    const n = pickPlantIds.length;
    if (!save()) return;
    pickAction = null;
    closeOverlay("pickOverlay");
    dayKey = pickDate;
    renderAll();
    if (detailId) openDetail(detailId);
    if (!$("dayOverlay").classList.contains("open")) openDay(pickDate);
    else renderDay();
    toast(n + "株に記録しました");
  };

  // ===== 記録のタグ選択（一覧から選ぶ。追加・削除は設定の「状態タグ」で行う） =====
  let logTags = [];          // いま開いている記録で選んでいるタグ

  function setTagsOpen(open) {
    $("lTagsBody").style.display = open ? "" : "none";
    $("lTagsCaret").textContent = open ? "▲" : "▼";
  }
  function renderLogTags() {
    const all = tagList();
    const names = all.concat(logTags.filter((t) => !all.includes(t)));
    $("lTagsBox").style.display = names.length ? "" : "none";
    $("lTagsSel").textContent = logTags.length ? logTags.length + "件選択中" : "";
    $("lTags").innerHTML = names.map((t) =>
      '<button type="button" class="tag-chip pick' + (logTags.includes(t) ? ' on' : '') + '" data-tag="' + escapeHtml(t) + '">' +
      escapeHtml(t) + '</button>').join("");
  }
  function resetLogTags(log) {
    logTags = log && Array.isArray(log.tags) ? log.tags.slice() : [];
    setTagsOpen(logTags.length > 0);
    renderLogTags();
  }

  $("lTags").onclick = (e) => {
    const b = e.target.closest("[data-tag]");
    if (!b) return;
    const name = b.dataset.tag;
    logTags = logTags.includes(name) ? logTags.filter((t) => t !== name) : logTags.concat(name);
    renderLogTags();
  };
  $("lTagsToggle").onclick = () => setTagsOpen($("lTagsBody").style.display === "none");

  // ===== 記録の追加・編集（日付・サイズ・写真・メモ） =====
  // ---------- 記録の追加・編集 ----------
  async function setLogPhoto(data) {
    logPhotoData = data;
    if (data) {
      const src = await getPhotoSrc(data);
      if (src) $("lPhotoPreview").src = src;
      $("lPhotoPreview").style.display = "block";
      $("lPhotoClear").style.display = "inline-block";
    } else {
      $("lPhotoPreview").removeAttribute("src");
      $("lPhotoPreview").style.display = "none";
      $("lPhotoClear").style.display = "none";
    }
  }
  function fmtDate(v) {
    const [y, m, d] = v.split("-").map(Number);
    return y + "年" + m + "月" + d + "日（" + WD[new Date(y, m - 1, d).getDay()] + "）";
  }
  function setLogDate(v) {
    $("lDate").value = v;
    $("lDateText").textContent = fmtDate(v);
  }
  function shiftLogDate(delta) {
    const [y, m, d] = $("lDate").value.split("-").map(Number);
    const dt = new Date(y, m - 1, d + delta);
    setLogDate(ymd(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  }

  let logFromHistory = false;   // 履歴から開いた記録は、保存後に履歴へ戻る
  function openLog(date, log, presetPlantId, presetAction, fromHistory) {
    logFromHistory = !!fromHistory;
    if (state.plants.length === 0) { toast("先に植物を登録してください"); return; }
    logEditId = log ? log.id : null;
    $("logTitle").textContent = log ? "記録を編集" : "記録する";
    setLogDate(date);
    $("lPlant").innerHTML = state.plants.map((p) => '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>').join("");
    $("lPlant").value = log ? log.plantId : (presetPlantId || state.plants[0].id);
    $("lAction").innerHTML = ACTIONS.map((a) => '<option value="' + a + '">' + a + '</option>').join("");
    $("lAction").value = log ? log.action : (presetAction || "水やり");
    $("lHeight").value = log && log.height ? log.height : "";
    $("lDia").value = log && log.diameter ? log.diameter : "";
    $("lMemo").value = log ? log.memo : "";
    $("lPhoto").value = "";
    setLogPhoto(log && log.photo ? log.photo : null);
    resetLogTags(log);
    $("logOverlay").classList.add("open");
  }
  function parseMm(id) {
    const raw = $(id).value.trim();
    if (raw === "") return { ok: true, value: null };
    const n = Math.round(Number(raw));
    if (!Number.isFinite(n) || n < 0 || n > 99999) return { ok: false };
    return { ok: true, value: n || null };
  }
  function saveLog() {
    const plantId = $("lPlant").value;
    if (!plantId) { toast("植物を選んでください"); return; }
    const h = parseMm("lHeight");
    const dia = parseMm("lDia");
    if (!h.ok || !dia.ok) { toast("サイズは0〜99999mmの数字で入力してください"); return; }
    const date = $("lDate").value || dayKey || todayStr();
    const action = $("lAction").value;
    const memo = $("lMemo").value.trim();
    const data = { date, plantId, action, memo, height: h.value, diameter: dia.value, photo: logPhotoData || null, tags: logTags.slice() };
    if (logEditId) {
      const log = state.logs.find((x) => x.id === logEditId);
      if (log) Object.assign(log, data);
      toast("更新しました");
    } else {
      state.logs.push(Object.assign({ id: uid() }, data));
      toast("記録しました");
    }
    if (action === "水やり") {
      const p = state.plants.find((x) => x.id === plantId);
      if (p && (!p.lastWatered || date > p.lastWatered)) p.lastWatered = date;
    }
    if (!save()) return;
    closeOverlay("logOverlay");
    closeOverlay("pickOverlay");
    dayKey = date;
    renderAll();
    if (detailId) openDetail(detailId);
    refreshHistory();
    if (logFromHistory) return;
    if (!$("dayOverlay").classList.contains("open")) openDay(date);
    else renderDay();
  }

  $("logCancel").onclick = () => closeOverlay("logOverlay");
  $("lPrev").onclick = () => shiftLogDate(-1);
  $("lNext").onclick = () => shiftLogDate(1);
  $("logSave").onclick = saveLog;
  $("lPhoto").onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try { setLogPhoto(await resizeImage(f, PHOTO_MAX, PHOTO_Q)); }
    catch (err) { toast("写真を読み込めませんでした"); }
  };
  $("lPhotoClear").onclick = () => { setLogPhoto(null); $("lPhoto").value = ""; };

  // ===== 状態タグの管理（設定から開く。追加と削除） =====
  function renderTagCount() {
    $("tagCount").textContent = "登録 " + tagList().length + "件";
  }
  function renderTagManager() {
    $("tagList").innerHTML = tagList().map((t) =>
      '<div class="item tag-row" data-tag="' + escapeHtml(t) + '"><span>' + escapeHtml(t) + '</span>' +
      '<button class="danger" style="padding:10px 16px;font-size:15px;min-width:72px;min-height:44px;" data-del-tag="' + escapeHtml(t) + '">削除</button></div>').join("");
    renderTagCount();
  }
  function openTagManager() {
    $("tagNew").value = "";
    renderTagManager();
    $("tagOverlay").classList.add("open");
  }
  function addTagFromInput() {
    const name = $("tagNew").value.trim();
    if (!name) return;
    const all = tagList();
    if (all.includes(name)) { toast("すでにあります"); return; }
    if (all.length >= TAG_MAX_COUNT) { toast("タグが多すぎます。整理してください"); return; }
    all.push(name);
    if (!save()) { all.pop(); return; }
    $("tagNew").value = "";
    renderTagManager();
  }

  $("tagManageBtn").onclick = openTagManager;
  $("tagAdd").onclick = addTagFromInput;
  $("tagNew").addEventListener("keydown", (e) => { if (e.key === "Enter") addTagFromInput(); });
  $("tagClose").onclick = () => closeOverlay("tagOverlay");
  $("tagList").onclick = (e) => {
    const b = e.target.closest("[data-del-tag]");
    if (!b) return;
    const name = b.dataset.delTag;
    askConfirm("「" + name + "」を削除しますか？記録に付けたタグは残ります。", () => {
      const all = tagList();
      const i = all.indexOf(name);
      if (i >= 0) all.splice(i, 1);
      if (save()) renderTagManager();
    });
  };

  // 長押しして上下にドラッグすると順番を入れ替えられる
  (function () {
    const box = $("tagList");
    let row = null, timer = null, active = false, startY = 0, baseTop = 0, pid = null;
    function end(commit) {
      clearTimeout(timer);
      if (row && active) {
        row.classList.remove("dragging");
        row.style.transform = "";
        box.classList.remove("sorting");
        if (commit) {
          const order = Array.from(box.querySelectorAll(".tag-row")).map((r) => r.dataset.tag);
          const all = tagList();
          const before = all.slice();
          if (order.length === all.length && order.join("\n") !== before.join("\n")) {
            all.splice(0, all.length, ...order);
            if (!save()) all.splice(0, all.length, ...before);
          }
        }
        renderTagManager();
      }
      row = null; active = false; pid = null;
    }
    box.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button") || !e.isPrimary) return;
      const r = e.target.closest(".tag-row");
      if (!r) return;
      row = r; startY = e.clientY; pid = e.pointerId; active = false;
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (!row) return;
        active = true;
        baseTop = row.offsetTop;
        row.classList.add("dragging");
        box.classList.add("sorting");
        try { row.setPointerCapture(pid); } catch (_) {}
        if (navigator.vibrate) navigator.vibrate(12);
      }, 380);
    });
    box.addEventListener("pointermove", (e) => {
      if (!row || e.pointerId !== pid) return;
      if (!active) {
        if (Math.abs(e.clientY - startY) > 8) { clearTimeout(timer); row = null; }
        return;
      }
      e.preventDefault();
      const prev = row.previousElementSibling, next = row.nextElementSibling;
      const dy = e.clientY - startY - (row.offsetTop - baseTop);
      row.style.transform = "translateY(" + dy + "px)";
      const rc = row.getBoundingClientRect(), mid = rc.top + rc.height / 2;
      if (prev) { const pr = prev.getBoundingClientRect(); if (mid < pr.top + pr.height / 2) { box.insertBefore(row, prev); } }
      if (next) { const nr = next.getBoundingClientRect(); if (mid > nr.top + nr.height / 2) { box.insertBefore(next, row); } }
      const dy2 = e.clientY - startY - (row.offsetTop - baseTop);
      row.style.transform = "translateY(" + dy2 + "px)";
      // 画面の端に近いときは一覧を自動でスクロール
      const sc = box.closest(".sheet");
      if (sc) { const sr = sc.getBoundingClientRect(); if (e.clientY < sr.top + 50) sc.scrollTop -= 8; else if (e.clientY > sr.bottom - 50) sc.scrollTop += 8; }
    });
    box.addEventListener("pointerup", () => end(true));
    box.addEventListener("pointercancel", () => end(false));
    box.addEventListener("contextmenu", (e) => { if (e.target.closest(".tag-row")) e.preventDefault(); });
    // 長押し中に画面がスクロールしないようにする
    box.addEventListener("touchmove", (e) => { if (active) e.preventDefault(); }, { passive: false });
  })();

  // ===== バックアップの書き出し・読み込み =====
  // ---------- バックアップ ----------
  async function getCap(name) {
    try {
      if (window.claude && typeof window.claude.use === "function") return await window.claude.use(name);
    } catch (e) { /* 利用できない環境 */ }
    return null;
  }
  // 書き出しに成功した日を覚えておく（設定画面の「最終バックアップ」表示に使う）
  function markBackup() {
    state.settings.lastBackup = todayStr();
    save();
    renderBackupInfo();
  }
  async function exportData() {
    const payload = {
      app: "plantManager", version: 2, exportedAt: new Date().toISOString(),
      data: await portableData()
    };
    const json = JSON.stringify(payload);
    const filename = "plant-manager-" + todayStr() + ".json";
    const dl = await getCap("downloads");
    if (dl) {
      try { await dl.save({ filename, data: json }); markBackup(); toast("書き出しました"); return; }
      catch (e) { if (e && e.code === "declined") return; }
    }
    const file = new File([json], filename, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: "Verdant Log のバックアップ" });
        markBackup();
        toast("書き出しました");
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    try {
      const url = URL.createObjectURL(file);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      markBackup();
    } catch (e) { /* 次の表示で対応 */ }
    $("exportText").value = json;
    $("exportFallback").style.display = "block";
    toast("保存できない場合は、下の「内容をコピー」を使ってください");
  }
  async function copyExport() {
    const t = $("exportText");
    try {
      await navigator.clipboard.writeText(t.value);
      toast("コピーしました");
    } catch (e) {
      t.focus();
      t.select();
      try { document.execCommand("copy"); toast("コピーしました"); }
      catch (err) { toast("長押しで選択してコピーしてください"); }
    }
  }
  async function importFile(e) {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    let obj;
    try { obj = JSON.parse(await f.text()); } catch (err) { toast("ファイルを読み込めませんでした"); return; }
    const d = obj && obj.data;
    if (!d || !Array.isArray(d.plants) || !Array.isArray(d.logs)) { toast("Verdant Log のバックアップファイルではありません"); return; }
    askConfirm("現在のデータを、選んだファイルの内容に置き換えます。よろしいですか？", () => {
      state.plants = d.plants;
      state.logs = d.logs;
      if (d.settings) state.settings = Object.assign({ theme: "system", size: "normal" }, d.settings);
      migrate();
      if (save()) { applySettings(); renderAll(); toast("読み込みました"); }
    });
  }

  $("exportBtn").onclick = exportData;
  $("copyExport").onclick = copyExport;
  $("importFile").onchange = importFile;

  // ===== 起動画面 =====
  // ---------- 起動画面 ----------
  const SPLASH_ICONS = ["caudex", "agave", "cactus"];
  $("splashIc").innerHTML = '<use href="#i-' + SPLASH_ICONS[Math.floor(Math.random() * SPLASH_ICONS.length)] + '"/>';
  setTimeout(() => $("splash").classList.add("hide"), 1500);
  setTimeout(() => { const sp = $("splash"); if (sp) sp.remove(); }, 2100);

  // ===== 全体の再描画と起動処理 =====
  function renderAll() { renderHero(); renderCalendar(); renderPlants(); renderGrowth(); renderSettings(); }

  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
  updateHeader("calendar");
  initPhotos();
  loadData().catch(() => {}).then(() => { applySettings(); renderAll(); });
})();
</script>
</body>
